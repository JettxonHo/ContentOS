name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only workflow: least privilege, no token persistence, no repository
# credentials referenced, no artifact upload, no deployment or release step.
permissions:
  contents: read

jobs:
  classify:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify pull request paths
        id: scope
        shell: bash
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git rev-parse HEAD^1 >/dev/null 2>&1; then
            docs_only=true
            saw_path=false
            while IFS= read -r path; do
              saw_path=true
              case "$path" in
                *.md|.github/ISSUE_TEMPLATE/*) ;;
                *) docs_only=false; break ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
            if [ "$saw_path" != "true" ]; then
              docs_only=false
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docker-independent:
    name: Docker-independent quality
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify Node version
        run: |
          v="$(node --version)"
          if [ "$v" != "v24.18.0" ]; then
            echo "Expected Node v24.18.0 from .node-version, got $v" >&2
            exit 1
          fi
      - name: Verify Corepack pnpm version
        run: |
          v="$(corepack pnpm --version)"
          if [ "$v" != "11.17.0" ]; then
            echo "Expected pnpm 11.17.0 via Corepack, got $v" >&2
            exit 1
          fi
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Workspace resolution
        if: needs.classify.outputs.docs_only != 'true'
        run: corepack pnpm workspace:check
      - name: Docker-independent quality gate (format/lint/typecheck/test/build)
        if: needs.classify.outputs.docs_only != 'true'
        run: corepack pnpm check
      - name: Documentation formatting gate
        if: needs.classify.outputs.docs_only == 'true'
        shell: bash
        run: |
          git diff --name-only -z HEAD^1 HEAD -- '*.md' '.github/ISSUE_TEMPLATE/**' \
            | xargs -0 corepack pnpm exec prettier --check --ignore-unknown
      - name: Repository checks (Markdown links, Decision register, Secret scan)
        run: corepack pnpm repository:check

  integration-smoke:
    name: Integration smoke (Docker)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify Node version
        run: |
          v="$(node --version)"
          if [ "$v" != "v24.18.0" ]; then
            echo "Expected Node v24.18.0 from .node-version, got $v" >&2
            exit 1
          fi
      - name: Verify Corepack pnpm version
        run: |
          v="$(corepack pnpm --version)"
          if [ "$v" != "11.17.0" ]; then
            echo "Expected pnpm 11.17.0 via Corepack, got $v" >&2
            exit 1
          fi
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Integration smoke harness (Docker-dependent)
        run: corepack pnpm test:integration

  browser-smoke:
    name: M1/M2 browser smoke (Chromium)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify Node and Corepack pnpm versions
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(corepack pnpm --version)" = "11.17.0"
      - name: Install workspace (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: M1/M2 browser scenario
        run: corepack pnpm test:browser
